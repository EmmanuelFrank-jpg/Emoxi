<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMOXI Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --accent-green: #00ff88;
            --accent-gold: #ffcc00;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .user-info h2 {
            font-size: 18px;
            color: var(--text-main);
        }

        .badge-unverified {
            font-size: 11px;
            background: rgba(255, 75, 75, 0.15);
            color: #ff4b4b;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .balance-card {
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .balance-title {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 4px;
        }

        .mining-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .mining-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            transition: opacity 0.2s;
        }

        .mining-btn:active {
            opacity: 0.8;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        .task-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-info h4 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .task-info p {
            font-size: 12px;
            color: var(--accent-gold);
        }

        .task-action-btn {
            background: transparent;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <h2 id="username">EMOXI User</h2>
        </div>
        <div id="status-badge" class="badge-unverified">Unverified ❌</div>
    </header>

    <div class="balance-card">
        <div class="balance-title">Total Balance</div>
        <div class="balance-amount" id="balance">0.0000 EMO</div>
        <div style="font-size: 12px; color: var(--text-muted);">≈ $0.00 USD</div>
    </div>

    <div class="mining-section">
        <div class="section-title">ACTIVE MINING RIG</div>
        <div style="font-size: 14px;" id="mining-status">Status: Idle</div>
        <button class="mining-btn" onclick="startMining()">⚡ Start Mining Cycle</button>
    </div>

    <div class="section-title">EARNING TASKS (0/50 Completed)</div>
    <div class="task-list">
        <div class="task-item">
            <div class="task-info">
                <h4>Join Official Channel</h4>
                <p>+0.50 EMO</p>
            </div>
            <button class="task-action-btn" onclick="completeTask(this)">Start</button>
        </div>
        <div class="task-item">
            <div class="task-info">
                <h4>Invite a Friend</h4>
                <p>+1.00 EMO</p>
            </div>
            <button class="task-action-btn" onclick="completeTask(this)">Invite</button>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp context
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Pull Telegram user name if available
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name || "EMOXI User";
        }

        function startMining() {
            const statusEl = document.getElementById('mining-status');
            statusEl.innerText = "Status: Mining Active 🟢 (Ends in 8h)";
            tg.HapticFeedback.notificationOccurred('success');
        }

        function completeTask(btn) {
            btn.innerText = "Done ✅";
            btn.style.borderColor = "#8b949e";
            btn.style.color = "#8b949e";
            tg.HapticFeedback.impactOccurred('medium');
        }
    </script>

</body>
</html>
