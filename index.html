<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EMOXI AI Network</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0c0a17;
            --card-bg: #151128;
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #6366f1;
            --accent-purple-light: #818cf8;
            --accent-green: #10b981;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 95px;
            min-height: 100vh;
        }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #080612;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-card {
            width: 100px;
            height: 100px;
            background: #151128;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            position: relative;
            margin-bottom: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }

        .splash-title { font-size: 24px; font-weight: 800; }
        .splash-title span { color: var(--accent-purple-light); }

        /* TAB PAGES */
        .tab-page { display: none; flex-direction: column; gap: 14px; }
        .tab-page.active { display: flex; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* BANNER CARD */
        .banner-card {
            background: linear-gradient(135deg, #1e173b, #120d24);
            border: 1px solid rgba(99, 102, 241, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            border-radius: 20px;
        }

        .badge-pill {
            display: inline-block;
            background: rgba(99, 102, 241, 0.18);
            color: var(--accent-purple-light);
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .banner-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .banner-sub { font-size: 11px; color: var(--text-muted); line-height: 1.4; max-width: 82%; }

        /* LINK BOX */
        .link-input-box {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 6px 6px 6px 12px;
            align-items: center;
            margin: 14px 0;
        }

        .link-text {
            font-size: 11px;
            color: var(--text-muted);
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-copy {
            background: var(--accent-purple);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-share {
            width: 100%;
            background: var(--accent-purple);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        /* 4 STAT GRID */
        .stats-4grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
        }

        .stat-card-title { font-size: 10px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; }
        .stat-card-val { font-size: 18px; font-weight: 800; margin-top: 4px; }

        /* INVITED FRIENDS LIST */
        .invited-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
        }
        .invited-row:last-child { border-bottom: none; }

        .invited-left { display: flex; align-items: center; gap: 12px; }
        .invited-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #312e81, #1e1b4b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
        }

        .invited-user { font-size: 13px; font-weight: 700; }
        .invited-time { font-size: 11px; color: var(--text-muted); }

        /* ACCOUNT SETTINGS MENU */
        .menu-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .menu-left { display: flex; align-items: center; gap: 12px; }
        .menu-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-purple-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .menu-title { font-size: 14px; font-weight: 700; }
        .menu-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .status-badge-text { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 10px; }

        /* MODAL FOR LEADERBOARD & ACCOUNT VERIFICATION */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px
